# Platform System Configuration
environment: development
platform_name: "Universal Wealth-Management Data Migration Platform"
migration_id: "MIG-CORECAP-2026"

control_plane:
  db_dialect: "postgresql"
  db_host: "localhost"
  db_port: 5432
  db_name: "wealth_migration_control_plane"
  db_user: "migration_admin"
  db_password_env: "CONTROL_PLANE_DB_PASS"

data_plane:
  storage_path: "./data_plane/storage"
  execution_engine: "python_local"
  enable_auto_rollback: true
  aum_drift_tolerance_pct: 0.5000 # Strict AUM variance threshold percentage

target_adapters:
  salesforce_sparc:
    adapter_id: "ADAPT-SPARC-V1"
    api_version: "v58.0"
    batch_size: 2000
    staging_schema: "sparc_staging"
  orion_eclipse:
    adapter_id: "ADAPT-ORION-V1"
    api_version: "v1.0"
    batch_size: 5000
    staging_schema: "orion_staging"

logging:
  level: "INFO"
  format: "json"
  destination: "./logs/migration_platform.log"