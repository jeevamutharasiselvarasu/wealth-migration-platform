# Firm configuration: target-first, versioned, reusable across migrations.
# Defines the firm's CANONICAL contract (types, nullability, keys) and registers the
# target system. It does NOT define canonical-to-target mapping; that lives in
# the confirmed target model (inferred from the target service) and the target_mappings table.
#
# v1.1.0 (2026-11-02): extended from the CoreCap (Amplify) data dictionary and the Orion Master Client List and
# SPARC target layouts. Source-to-canonical required fields are unchanged except that REP_CODE is optional on
# Account and Household (2.6% null at source; Households carry an advisor, not a rep code). Fields the targets need
# but the source cannot always supply are nullable here and carry `required_for_targets`, to be enforced when
# canonical-to-target mapping starts. `sensitive` marks personal data that must never appear in lineage or previews.
# v1.2.0 (2026-11-11): Advisor and AccountRole added (canonical model v2, phase 2); field names as in platform_knowledge/canonical_model_v2.yaml.
# v1.3.0 (2026-11-13): CoreCap to Simplicity (Orion MCL and SPARC) spec: Household head and trust fields, Account fee and flow fields,
#   and the Model, ModelWeight, AccountModel and AccountGainLoss entities for SPARC. All new fields are nullable: no source or target requires them for Orion.
# v1.4.0 (2026-11-13): AccountAllocation (Account_Targets: the model or the securities an account targets) replaces AccountModel; Model and ModelWeight carry the drift fields.
# SEED VALUES: keys/types still need business owner confirmation before being treated as final.
schema_version: 1
firm_id: SIMPLICITY
firm_name: Simplicity
config_version: "1.4.0"
scope_direction: source_to_canonical
canonical_contract_ref: Simplicity-MCL-v1
target_system:
  name: Simplicity
  kind: WEALTH_PLATFORM
  load_strategy: CURATED_FILE_OUTPUT
entities:
  Account:
    grain: One legal/custodial account identity
    fields:
      - {name: ACCT_NUM, type: string, nullable: false, is_key: true, description: "Custodian-issued account number (source AccountNumber). Natural key is custodian plus number. Keep as text; reject name text and values over 20 characters."}
      - {name: CUSTODIAN_CODE, type: string, nullable: true, description: "Custodian code, derived from CUSTODIAN_NAME by a versioned value map when a code list is supplied (source has 73 free-text names); optional because some targets take the custodian name as-is."}
      - {name: REG_TYPE, type: string, nullable: false, required_for_targets: [ORION_MCL, SPARC], description: "Registration type (source RegistrationType, about 29% null at source). Nulls are exceptions, never defaulted. Value map needed for the target lists."}
      - {name: OPEN_DATE, type: date, nullable: false, description: "Date the account was opened at the custodian (source CustodialStartDate)."}
      - {name: REP_CODE, type: string, nullable: true, description: "Custodian-assigned representative code (source RepCode, 2.6% null)."}
      - {name: ACCOUNT_ID, type: string, nullable: true, description: "Source system identifier (source AccountId GUID). Kept separate from the custodian account number."}
      - {name: ACCT_NAME, type: string, nullable: true, required_for_targets: [ORION_MCL], description: "Account display name, pattern '<client name> - <type>' (source AccountName). Registration names are derived from it."}
      - {name: CUSTODIAN_NAME, type: string, nullable: true, required_for_targets: [ORION_MCL, SPARC], description: "Raw custodian name from the source (CustodianName); feeds the CUSTODIAN_CODE value map."}
      - {name: HH_ID, type: string, nullable: true, description: "Household the account belongs to (source HouseholdId; 0.5% null, a few orphans)."}
      - {name: BALANCE, type: decimal, nullable: true, required_for_targets: [SPARC], description: "Current account balance in dollars (source Balance)."}
      - {name: BALANCE_AS_OF, type: date, nullable: true, description: "Date BALANCE is reported as of (source ReportedAsOfDate)."}
      - {name: TAX_STATUS, type: string, nullable: true, description: "Tax treatment: Taxable, TaxDeferred or NonTaxable (source TaxStatus)."}
      - {name: ACCT_STATUS, type: string, nullable: true, required_for_targets: [ORION_MCL], description: "Open or Closed, derived: Open when CLOSED_DATE is empty, else Closed."}
      - {name: CLOSED_DATE, type: date, nullable: true, description: "Date the account was closed (source ClosedDate); empty means open."}
      - {name: MARKET_VALUE, type: decimal, nullable: true, description: "Market value used for the fee (Billing_OffB.Market Value, SPARC)."}
      - {name: FEE_SCHEDULE, type: decimal, nullable: true, description: "Account fee schedule rate (Billing_OffB.Account Fee Schedule, SPARC). Confirm what the column holds."}
      - {name: TOTAL_FEE, type: decimal, nullable: true, description: "Total fee: MARKET_VALUE times FEE_SCHEDULE (SPARC)."}
      - {name: CONTRIBUTIONS, type: decimal, nullable: true, description: "Contributions (Performance_Account.Additions, SPARC)."}
      - {name: DISTRIBUTIONS, type: decimal, nullable: true, description: "Distributions (Performance_Account.Withdrawals, SPARC)."}
  Client:
    grain: One person, trust, or legal participant in the identity domain
    fields:
      - {name: CLIENT_ID, type: string, nullable: false, is_key: true, description: "Source contact identifier (source ContactId GUID)."}
      - {name: LEGAL_NAME, type: string, nullable: false, sensitive: true, description: "Full legal name; derived from first, middle and last name when the source has no single name field."}
      - {name: TAX_ID, type: string, nullable: false, sensitive: true, required_for_targets: [SPARC], description: "SSN or tax id (source TaxId). Never shown in lineage or previews."}
      - {name: CLIENT_TYPE, type: string, nullable: false, description: "individual, trust or business. The source EntityType holds only 'individual'; trusts and businesses need a business rule."}
      - {name: FIRST_NAME, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "Given name (source FirstName); may be blank for companies."}
      - {name: MIDDLE_NAME, type: string, nullable: true, sensitive: true, description: "Middle name or initial (source MiddleName)."}
      - {name: LAST_NAME, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "Family name (source LastName)."}
      - {name: DATE_OF_BIRTH, type: date, nullable: true, sensitive: true, description: "Date of birth (source DateOfBirth)."}
      - {name: HH_ID, type: string, nullable: true, required_for_targets: [ORION_MCL], description: "Household the client belongs to (source HouseholdId)."}
      - {name: HH_ORDER, type: integer, nullable: true, required_for_targets: [ORION_MCL, SPARC], description: "Rank within the household: 1 is the primary contact (1st owner), 2 the 2nd owner (source HouseholdOrder)."}
      - {name: HH_RELATIONSHIP, type: string, nullable: true, description: "Relationship to the household: Head, Spouse, Child and so on (source HouseholdRelationshipType; 22% null)."}
      - {name: ADDRESS_LINE_1, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "Primary street address (source Address1). One primary address per client."}
      - {name: ADDRESS_LINE_2, type: string, nullable: true, sensitive: true, description: "Suite, floor or apartment (source Address2)."}
      - {name: CITY, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "City (source City)."}
      - {name: STATE, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "State or province code (source State). SPARC wants full state names."}
      - {name: POSTAL_CODE, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL, SPARC], description: "ZIP or postal code, kept as text to preserve leading zeros (source Zip)."}
      - {name: COUNTRY, type: string, nullable: true, sensitive: true, description: "Country code (source Country)."}
      - {name: PHONE, type: string, nullable: true, sensitive: true, description: "Phone number (source Phone)."}
      - {name: EMAIL, type: string, nullable: true, sensitive: true, description: "Email address (source Email)."}
      - {name: EMPLOYER_NAME, type: string, nullable: true, description: "Employer (source EmployerName); used by SPARC only when moving between custodians."}
  Household:
    grain: One business/reporting grouping of related clients and/or accounts
    fields:
      - {name: HH_ID, type: string, nullable: false, is_key: true, required_for_targets: [ORION_MCL], description: "Source household identifier (source Id GUID); also the Orion HH Grouping Code."}
      - {name: HH_NAME, type: string, nullable: false, description: "Internal sort name, 'Last, First' (source HouseholdName)."}
      - {name: REP_CODE, type: string, nullable: true, description: "Representative code. Households have no rep code at source (they carry an advisor); optional and normally empty."}
      - {name: HH_DISPLAY_NAME, type: string, nullable: true, required_for_targets: [SPARC], description: "Formatted display name (source HouseholdProperName)."}
      - {name: ADVISOR_ID, type: string, nullable: true, required_for_targets: [ORION_MCL], description: "Advisor assigned to the household (source AdvisorId). The Orion Representative Name is resolved from it by a registered advisor list, not by a fourth entity."}
      - {name: CREATED_DATE, type: date, nullable: true, description: "Date the household record was created (source CreatedDate)."}
      - {name: HH_STATUS, type: string, nullable: true, description: "Active or Deleted, derived from DELETED_DATE. Whether deleted households migrate is a business decision."}
      - {name: DELETED_DATE, type: date, nullable: true, description: "Date the household was deleted or archived (source DeletedDate); empty means active."}
      - {name: HEAD_FIRST_NAME, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL], description: "First name of the household head, the contact with HouseholdOrder 1 (Household_Contacts.FirstName)."}
      - {name: HEAD_LAST_NAME, type: string, nullable: true, sensitive: true, required_for_targets: [ORION_MCL], description: "Last name of the household head (Household_Contacts.LastName)."}
      - {name: HEAD_NAME, type: string, nullable: true, sensitive: true, description: "Full name of the household head: first name and last name."}
      - {name: HEAD_TAX_ID, type: string, nullable: true, sensitive: true, description: "SSN or tax id of the household head (Household_Contacts.TaxId, HouseholdOrder 1). Never shown in lineage or previews."}
      - {name: HEAD_DATE_OF_BIRTH, type: date, nullable: true, sensitive: true, description: "Date of birth of the household head (Household_Contacts.DateOfBirth, HouseholdOrder 1)."}
      - {name: TRUST_NAME, type: string, nullable: true, description: "Business or trust name, only for a household whose contact first name contains Trust (SPARC)."}
      - {name: TRUST_DATE, type: date, nullable: true, description: "Trust date, same trust condition (SPARC). The spec takes it from DateOfBirth, which looks wrong; confirm with Simplicity."}
      - {name: TRUST_EIN, type: string, nullable: true, sensitive: true, description: "Business or trust EIN, same trust condition (SPARC; Household_Contacts.TaxId)."}
  Advisor:
    grain: One advisor (the representative on households and accounts)
    fields:
      - {name: ADVISOR_ID, type: string, nullable: false, is_key: true, description: "Advisor identifier (source Id GUID); Household.ADVISOR_ID points at it."}
      - {name: ADVISOR_NAME, type: string, nullable: false, description: "Advisor's name as shown to clients (source Name); the Orion Representative Name."}
      - {name: EMAIL, type: string, nullable: true, sensitive: true, description: "Work email (source Email)."}
      - {name: TITLE, type: string, nullable: true, description: "Job title (source Title)."}
      - {name: IS_ACTIVE, type: boolean, nullable: true, description: "Whether the advisor is active (source IsActive)."}
      - {name: REP_CODES, type: string, nullable: true, description: "Rep codes with their custodian (source RepCodes, a JSON list)."}
  AccountRole:
    grain: One client's role on one account (owner, joint owner, trustee, beneficiary, ...)
    fields:
      - {name: ACCT_NUM, type: string, nullable: false, description: "The account (Account.ACCT_NUM)."}
      - {name: CLIENT_ID, type: string, nullable: false, description: "The client (Client.CLIENT_ID); points at the surviving client after entity resolution."}
      - {name: ROLE, type: string, nullable: false, description: "Canonical account_role code (OWNER, JOINT_OWNER, TRUSTEE, BENEFICIARY, AUTHORIZED)."}
      - {name: ROLE_ORDER, type: integer, nullable: true, description: "Order of the role holders on the account (1 is the first owner)."}
  Model:
    grain: One investment model
    fields:
      - {name: MODEL_ID, type: string, nullable: false, is_key: true, description: "Model identifier (Models.Id)."}
      - {name: MODEL_NAME, type: string, nullable: false, description: "Model name (Models.Name); SPARC Current Model."}
  ModelWeight:
    grain: One security weight inside one model
    fields:
      - {name: MODEL_ID, type: string, nullable: false, description: "The model (Model.MODEL_ID; Model_Weights.ModelId)."}
      - {name: SYMBOL_ID, type: string, nullable: false, description: "Security identifier (Model_Weights.SymbolId)."}
      - {name: SYMBOL_NAME, type: string, nullable: true, description: "Security symbol (Model_Weights.SymbolName); SPARC Model Symbol."}
      - {name: SYMBOL_TYPE, type: string, nullable: true, description: "Type of the symbol (Model_Weights.SymbolType)."}
      - {name: ALLOCATION_PCT, type: decimal, nullable: true, description: "Target allocation of the security in the model (Model_Weights.AllocationPct)."}
      - {name: TARGET_DRIFT_UP, type: decimal, nullable: true, description: "Allowed drift above the target (Model_Weights.TargetDriftUp)."}
      - {name: TARGET_DRIFT_DOWN, type: decimal, nullable: true, description: "Allowed drift below the target (Model_Weights.TargetDriftDown)."}
  AccountAllocation:
    grain: "One target line of an account: the model the account follows, or one security with its target weight (Account_Targets)"
    fields:
      - {name: ACCT_NUM, type: string, nullable: false, description: "The account (Account.ACCT_NUM; Account_Targets.AccountNumber)."}
      - {name: ACCOUNT_ID, type: string, nullable: true, description: "Source account identifier (Account_Targets.AccountId)."}
      - {name: CUSTODIAN_NAME, type: string, nullable: true, description: "Custodian of the account as the target file states it (Account_Targets.CustodianName)."}
      - {name: TARGET_TYPE, type: string, nullable: false, description: "Model or Symbol: whether the line sets a model or a single security (Account_Targets.TargetType)."}
      - {name: MODEL_ID, type: string, nullable: true, description: "The model, for a Model line (Model.MODEL_ID; Account_Targets.ModelId; one value has no model, an orphan at source)."}
      - {name: MODEL_NAME, type: string, nullable: true, description: "Name of the model, as the target shows it (Account_Targets.ModelName); SPARC Current Model."}
      - {name: SYMBOL_ID, type: string, nullable: true, description: "The security, for a Symbol line (Account_Targets.SymbolId)."}
      - {name: SYMBOL_TYPE, type: string, nullable: true, description: "Type of the security (Account_Targets.SymbolType)."}
      - {name: SYMBOL_NAME, type: string, nullable: true, description: "Name of the security (Account_Targets.SymbolName); SPARC Model Symbol."}
      - {name: ALLOCATION_PCT, type: decimal, nullable: true, description: "Target allocation of the line as a fraction of the account (Account_Targets.AllocationPct)."}
      - {name: TARGET_DRIFT_UP, type: decimal, nullable: true, description: "Allowed drift above the target for a Symbol line (Account_Targets.TargetDriftUp)."}
      - {name: TARGET_DRIFT_DOWN, type: decimal, nullable: true, description: "Allowed drift below the target for a Symbol line (Account_Targets.TargetDriftDown)."}
      - {name: IS_PROTECTED, type: boolean, nullable: true, description: "Whether the security is protected from trading (Account_Targets.IsProtected)."}
      - {name: CASH_TARGET_DRIFT_UP, type: decimal, nullable: true, description: "Allowed drift above the cash target of the account (Account_Targets.CashTargetDriftUp)."}
      - {name: CASH_TARGET_DRIFT_DOWN, type: decimal, nullable: true, description: "Allowed drift below the cash target of the account (Account_Targets.CashTargetDriftDown)."}
  AccountGainLoss:
    grain: Realized gain or loss for one account
    fields:
      - {name: ACCT_NUM, type: string, nullable: false, description: "The account (Account.ACCT_NUM)."}
      - {name: GAIN_LOSS, type: decimal, nullable: true, description: "Total realized gain or loss (Realized Gain_Loss_Security_FIRM.Total Gain Loss). The file was not provided (decision D10)."}
