# Evidence the platform may use to propose which source column holds a canonical field: words in the column name, and what the values look like.
# Proposals only (a person approves). Key fields and date fields come from the firm configuration; this file adds the words, vocabularies and
# patterns of a domain. With no file, nothing is proposed from evidence (columns named like a canonical field still map to it).
