# How source column names map to canonical fields: knowledge a Platform Admin edits, not code.
#   catalog          a source column name that means the same canonical field in every file
#   entity_catalog   a header whose meaning depends on the file's entity (an "Id" column is a different key in each file)
#   relationships    a source column that links one entity to another (a candidate relationship a person confirms)
# A deployment for another domain supplies its own file (or none: columns named like a canonical field still map to it).
