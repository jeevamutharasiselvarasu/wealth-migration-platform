# Platform knowledge: generic wealth-management field vocabulary used to infer what a target system's
# tables and columns mean. Not specific to any one target. Each token on the left is normalised to the
# concept words on the right. Words listed under `weak` carry half weight when comparing names.
weak: [code, type, date, id, status]
tokens:
  acct: [account]
  account: [account]
  no: [id]
  num: [id]
  number: [id]
  nbr: [id]
  ref: [id]
  identifier: [id]
  key: [id]
  cd: [code]
  dt: [date]
  on: [date]
  opened: [open]
  opening: [open]
  open: [open]
  reg: [registration]
  registration: [registration]
  rep: [representative]
  advisor: [representative]
  adviser: [representative]
  representative: [representative]
  cust: [client]
  customer: [client]
  client: [client]
  segment: [client, type]
  hh: [household]
  household: [household]
  group: [household]
  custodian: [custodian]
  tax: [tax]
  tin: [tax, id]
  ssn: [tax, id]
  name: [name]
  legal: [legal]
  display: [display]
  onboard: [onboard]
  onboarded: [onboard]
  status: [status]
  country: [country]
