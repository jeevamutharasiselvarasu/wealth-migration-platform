# SIMULATED import targets built from the supplied workbook Data_Mapping_MCLSPARC.xlsx (generated by build_seed.py; do not edit by hand).
# Orion MCL (ImportRecords) and SPARC are flat import templates; they are split into household, client and account tables here.
# Reference lists hold only values that appear in the supplied workbooks: the full Orion controlled lists were not supplied.
# The platform never reads this file: it learns the target by inspecting the running service.
system: Orion MCL and SPARC import targets (simulated)
version: 0.3.0
code_lists:
  ORION_REF_REGISTRATION_TYPES:
  - IRA
  - IRA Rollover
  ORION_REF_CUSTODIANS:
  - Pershing
  - Schwab
  - TD Ameritrade
  ORION_REF_FUND_NAMES:
  - TD Ameritrade
  ORION_REF_COUNTRIES: []
tables:
  ORION_MCL_HOUSEHOLD:
    description: 'Orion MasterClientListWizard import: Household grouping and household-level names'
    columns:
    - name: HH_GROUPING_CODE
      type: string
      required: false
      description: HH Grouping Code. Conditional The HH Grouping Code, Household SSN, or Address Line 1 is required depending on your grouping selection at time of import. This field is the household grouping
        identifier, allowing Orion to correctly group client accounts to their proper household. Orion will auto-generate its own client IDs (fkClient) in the system when this list is imported, so the number
        you enter here is simply used as a grouping mechanism. All rows of data that contain the same 'HH Grouping Code' will be grouped under the same household/client in Orion. The numbering convention
        you see here; 1, 2...etc will be determined by you for grouping. This would be similar to a 'Group Name' in Advent/Portfolio Center. All fields highlighted in purple are client/household fields
        (columns A through Q). For each row where the HH Grouping Code is the same, these purple fields must match exactly. The same premise applies if you are grouping by Household SSN or Address Line
        1.
    - name: ORION_HOUSEHOLD_ID
      type: string
      required: false
      description: Orion Household Id. Not Required This should be populated only when loading a new account into an existing Household. Otherwise leave this field blank.
    - name: HOUSEHOLD_SSN
      type: string
      required: false
      description: Household SSN. Conditional HH Grouping Id, Household SSN, or Address Line 1 is required depending on your grouping selection at the time of import. This is typically the primary SSN or
        TaxID for the household. Format with or without dashes. Please note, for importing purposes, this has been formatted as a text value. Leave this field blank where the SSN or TaxID is unavailable.
        If the SSN or Tax ID is not provided, you will not be able to use Orion's auto-householding process for new accounts. If Orion is asked to load your SSN/Tax IDs after your MCL import there will
        be a fee for this work.
    - name: HOUSEHOLD_FIRST_NAME
      type: string
      required: false
      description: Household First Name. Not Required First Name should be entered; however, it can be left blank for company names.
    - name: HOUSEHOLD_LAST_NAME
      type: string
      required: true
      description: Household Last Name. Required.
    - name: HOUSEHOLD_NAME
      type: string
      required: false
      description: Household Name. Not Required This is typically referred to as the full name field and holds the full name/ title of the household. This name or title can differ from what is entered in
        the first and last name fields and is typically displayed as the title of the household when the client receives their statement. If left blank, it will be populated with the Household First Name
        space Household Last Name.
    - name: REPRESENTATIVE_NAME
      type: string
      required: true
      description: Representative Name. Required.
    - name: HOUSEHOLD_DOB
      type: date
      required: false
      description: Household DOB. Not Required.
  ORION_MCL_CLIENT:
    description: 'Orion MasterClientListWizard import: Account owners (clients), their contact details and identifiers'
    columns:
    - name: ADDRESS_LINE_1
      type: string
      required: true
      description: Address Line 1. Required.
    - name: ADDRESS_LINE_2
      type: string
      required: false
      description: Address Line 2. Not Required.
    - name: CITY
      type: string
      required: true
      description: City. Required.
    - name: STATE
      type: string
      required: true
      description: State. Required.
    - name: ZIP_CODE
      type: string
      required: true
      description: Zip Code. Required.
    - name: EMAIL_ADDRESS
      type: string
      required: false
      description: Email Address. Not Required However, if the client would like e-notifications for their statements, then this field is required.
    - name: PHONE_HOME
      type: string
      required: false
      description: Phone Home. Not Required Format this with or without dashes.
    - name: PHONE_BUSINESS
      type: string
      required: false
      description: Phone Business. Not Required Format this with or without dashes.
    - name: REGISTRATION_SSN
      type: string
      required: false
      description: Registration SSN. Recommended, but not Required This is the SSN or Tax ID assigned to the particular account. It may be formatted with or without dashes. Please note, for importing purposes,
        this has been formatted as a text value. Leave this field blank where the SSN or TaxID is unavailable.
    - name: REGISTRATION_DOB
      type: date
      required: false
      description: Registration DOB. Not Required If tracking RMD, this should be applied.
    - name: REGISTRATION_FIRST_NAME
      type: string
      required: false
      description: Registration First Name. Not Required This is the first name of the particular account owner. First Name should be entered; however, it can be left blank for company names.
    - name: REGISTRATION_LAST_NAME
      type: string
      required: true
      description: Registration Last Name. Required This is the last name of the particular account owner.
    - name: REGISTRATION_NAME
      type: string
      required: false
      description: Registration Name. Not Required This is typically referred to as the full name field and holds the full name/ title of the account. This name or title can differ from what is entered
        in the first and last name fields. If left blank, it will be populated with the Registration First Name space Registration Last Name.
  ORION_MCL_ACCOUNT:
    description: 'Orion MasterClientListWizard import: Custodial accounts'
    columns:
    - name: REGISTRATION_TYPE
      type: string
      required: true
      description: Registration Type. Required Registration Type is also known as Account Type. This provides a generic description for the account. Custom registration types may be added. Orion strongly
        encourages you to keep these generic and do not create custom descriptions per client, as this becomes difficult to maintain.
    - name: CUSTODIAN
      type: string
      required: true
      description: Custodian. Required This commonly represents the data feed from which the account flows to the database. Custom custodians may be added where necessary.
    - name: ACCOUNT_NUMBER
      type: string
      required: true
      description: Account Number. Required Custodial account number.
    - name: FUND_NAME
      type: string
      required: true
      description: Fund Name. Required This field should match the institution that custodies the account and in most cases will match the Custodian name.
    - name: OPEN_CLOSED
      type: string
      required: false
      description: Open/Closed. Optional Identify whether each account is presently open (active and funded), or closed at the custodian. If not populated, Orion will assume the account is active and funded.
    - name: OUTSIDE_ID
      type: string
      required: false
      description: Outside ID. Not Required When applicable, this field is in reference to an internal account identifier within your existing system.
  SPARC_HOUSEHOLD:
    description: 'SPARC household and account import: Household grouping and household-level names'
    columns:
    - name: HOUSEHOLD_NAME
      type: string
      required: true
      description: 'Household Name. Example: Mickey & Minnie Mouse.'
  SPARC_CLIENT:
    description: 'SPARC household and account import: Account owners (clients), their contact details and identifiers'
    columns:
    - name: FIRST_OWNER_TTEE_FIRST_NAME
      type: string
      required: true
      description: '1st Owner / TTEE First Name. Example: Minnie.'
    - name: FIRST_OWNER_TTEE_LAST_NAME
      type: string
      required: true
      description: '1st Owner / TTEE Last Name (complete columns L-S). Example: Mouse.'
    - name: SECOND_OWNER_TTEE_FIRST_AND_LAST_NAME
      type: string
      required: false
      description: '2nd Owner / TTEE First & Last Name (if applicable - then complete columns T-AA). Example: Mickey Mouse.'
    - name: BUSINESS_OR_TRUST_NAME
      type: string
      required: false
      description: 'Business or Trust Name (if applicable). Example: M & M Mouse TTEEs Mouse Family Trust.'
    - name: TRUST_DATE
      type: date
      required: false
      description: 'Trust Date (if applicable). Example: 2000-12-31 00:00:00.'
    - name: BUSINESS_OR_TRUST_EIN
      type: string
      required: false
      description: 'Business or Trust EIN (if applicable). Example: 33-0000000.'
    - name: FIRST_CLIENT_TTEE_MOBILE_PHONE
      type: string
      required: true
      description: '1st Client / TTEE Mobile Phone #. Example: 222-222-2222.'
    - name: FIRST_CLIENT_EMAIL_ADDRESS
      type: string
      required: true
      description: '1st Client Email Address. Example: minniemouse@noemail.com.'
    - name: FIRST_CLIENT_STREET_ADDRESS
      type: string
      required: true
      description: '1st Client Street Address. Example: 111 Any Street.'
    - name: FIRST_CLIENT_STREET_ADDRESS2
      type: string
      required: false
      description: '1st Client Street Address2. Example: Suite 100.'
    - name: FIRST_CLIENT_CITY
      type: string
      required: true
      description: '1st Client City. Example: Minneapolis.'
    - name: FIRST_CLIENT_STATE
      type: string
      required: true
      description: '1st Client State (no abbreviations). Example: Minnesota.'
    - name: FIRST_CLIENT_ZIP_CODE
      type: string
      required: true
      description: '1st Client Zip Code. Example: 55408.0.'
    - name: FIRST_CLIENT_DOB
      type: date
      required: true
      description: '1st Client DOB. Example: 1900-02-02 00:00:00.'
    - name: FIRST_CLIENT_SSN
      type: string
      required: true
      description: '1st Client SSN. Example: 222222222.0.'
    - name: SECOND_CLIENT_TTEE_MOBILE_PHONE
      type: string
      required: false
      description: '2nd Client / TTEE Mobile Phone #. Example: 1111111111.0.'
    - name: SECOND_CLIENT_EMAIL
      type: string
      required: false
      description: '2nd Client Email. Example: mickeymouse@noemail.com.'
    - name: SECOND_CLIENT_STREET_ADDRESS
      type: string
      required: false
      description: '2nd Client Street Address. Example: 111 Any Street.'
    - name: SECOND_CLIENT_CITY
      type: string
      required: false
      description: '2nd Client City. Example: Minneapolis.'
    - name: SECOND_CLIENT_STATE
      type: string
      required: false
      description: '2nd Client State (no abbreviations). Example: Minnesota.'
    - name: SECOND_CLIENT_ZIP_CODE
      type: string
      required: false
      description: '2nd Client Zip Code. Example: 55408.0.'
    - name: SECOND_CLIENT_DOB
      type: date
      required: false
      description: '2nd Client DOB. Example: 1900-01-01 00:00:00.'
    - name: SECOND_CLIENT_SSN
      type: string
      required: false
      description: '2nd Client SSN. Example: 111111111.0.'
    - name: EMPLOYMENT
      type: string
      required: false
      description: Employment (only for moving different custodians).
  SPARC_ACCOUNT:
    description: 'SPARC household and account import: Custodial accounts'
    columns:
    - name: CUSTODIAN_FUND_FAMILY
      type: string
      required: true
      description: 'Custodian / Fund Family. Example: Pershing.'
    - name: ACCOUNT_NUMBER
      type: string
      required: true
      description: 'Account Number (Delivering Firm). Example: 777777777.0.'
    - name: REGISTRATION_TYPE
      type: string
      required: true
      description: 'Registration Type. Example: IRA.'
    - name: ACCOUNT_VALUE
      type: number
      required: true
      description: 'Account Value. Example: 25000.0.'
    - name: TOTAL_FEE
      type: number
      required: false
      description: Total Fee.
    - name: CONTRIBUTIONS_DISTRIBUTIONS_INFO
      type: string
      required: false
      description: Contributions/Distributions Info.
    - name: CURRENT_MODEL_OPTIONAL
      type: string
      required: false
      description: Current Model(s) Optional.
    - name: MODEL_SYMBOL_OPTIONAL
      type: string
      required: false
      description: Model Symbol Optional.
    - name: GAIN_LOSS_IF_APPLICABLE_OPTIONAL
      type: string
      required: false
      description: Gain/Loss if Applicable Optional.
