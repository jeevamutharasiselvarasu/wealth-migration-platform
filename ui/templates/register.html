<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - XODUS-AMP Data Migration Workbench</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #f4f7fc; color: #1c2a4a; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="bg-[#f4f7fc] text-[#1c2a4a] min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl border border-[#d9e3f5] p-8 space-y-5 shadow-xl">
        <div class="text-center space-y-2">
            <div class="h-12 w-12 bg-gradient-to-br from-blue-600 to-teal-500 rounded-xl flex items-center justify-center font-mono font-bold text-white text-base shadow mx-auto">XA</div>
            <h1 class="text-2xl font-extrabold text-[#152c6b] tracking-tight">XODUS<b class="text-teal-600">-AMP</b></h1>
            <p class="text-xs text-[#5a6a88] font-semibold">Request an account</p>
        </div>
        {% if notice %}<div class="bg-teal-50 border border-teal-200 text-teal-900 text-xs p-3 rounded-xl font-medium text-center" data-testid="register-notice">{{ notice }}</div>{% endif %}
        {% if error %}<div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl font-medium text-center" data-testid="register-error">{{ error }}</div>{% endif %}
        <form action="/register" method="POST" class="space-y-4">
            <div><label for="reg-name" class="block text-xs font-bold text-[#41506b] mb-1 font-mono uppercase">Full name</label><input id="reg-name" name="name" required minlength="2" maxlength="80" autocomplete="name" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded-xl px-3.5 py-2.5 text-xs text-[#1c2a4a] focus:outline-none focus:border-blue-500 font-mono"></div>
            <div><label for="reg-email" class="block text-xs font-bold text-[#41506b] mb-1 font-mono uppercase">Email address</label><input type="email" id="reg-email" name="email" required autocomplete="username" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded-xl px-3.5 py-2.5 text-xs text-[#1c2a4a] focus:outline-none focus:border-blue-500 font-mono"></div>
            <div><label for="reg-password" class="block text-xs font-bold text-[#41506b] mb-1 font-mono uppercase">Password (10+ characters)</label><input type="password" id="reg-password" name="password" required minlength="10" autocomplete="new-password" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded-xl px-3.5 py-2.5 text-xs text-[#1c2a4a] focus:outline-none focus:border-blue-500 font-mono"></div>
            <div><label for="reg-confirm" class="block text-xs font-bold text-[#41506b] mb-1 font-mono uppercase">Confirm password</label><input type="password" id="reg-confirm" name="confirm" required minlength="10" autocomplete="new-password" class="w-full bg-[#f8fafc] border border-[#cbd5e1] rounded-xl px-3.5 py-2.5 text-xs text-[#1c2a4a] focus:outline-none focus:border-blue-500 font-mono"></div>
            <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
            <p class="rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs leading-5 text-blue-800">Your request stays pending until a Platform Admin approves it and assigns your roles. Passwords are stored only as salted hashes.</p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">Request account</button>
            <p class="text-center text-xs text-[#5a6a88]">Already approved? <a href="/login" class="font-bold text-blue-700">Sign in</a></p>
        </form>
    </div>
</body>
</html>
