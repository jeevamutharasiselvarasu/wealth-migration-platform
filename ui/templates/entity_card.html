{% extends "base.html" %}

{% block content %}
<div class="space-y-6 max-w-6xl">
    <h1 class="text-2xl font-bold text-white">Canonical Entity Menu Card</h1>

    <div class="bg-[#161f30] rounded-xl border border-slate-700/60 p-6">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-[#0f172a] text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700/60">
                    <tr>
                        <th class="p-3">Canonical Entity</th>
                        <th class="p-3">Source Concept</th>
                        <th class="p-3">Target Destination</th>
                        <th class="p-3">Mapping Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-700/50">
                    {% for ent in entities %}
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 font-semibold text-white">{{ ent.entity_name }}</td>
                        <td class="p-3 text-slate-400">{{ ent.source_concept }}</td>
                        <td class="p-3 text-indigo-400 font-medium">{{ ent.target_system }}</td>
                        <td class="p-3">
                            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded text-xs font-medium">
                                {{ ent.status }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
