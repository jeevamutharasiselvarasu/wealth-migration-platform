<header class="xtop">
  <div class="wrap xtop-in">
    <a class="xbrand" href="/suite" aria-label="XODUS suite home">
      <span class="xmark" aria-hidden="true"></span>
      <span><strong>Xodus</strong><span>M&amp;A integration co-pilot for RIAs</span></span>
    </a>
    <nav class="xnav" aria-label="Suite spaces">
      <a class="deal{% if suite_cur == 'deal' %} on{% endif %}" href="/deal-room"><i></i>Deal Room</a>
      <a class="dm{% if suite_cur == 'dm' %} on{% endif %}" href="/migrations"{% if suite_cur == 'dm' %} aria-current="page"{% endif %}><i></i>Data Migration</a>
      <a class="gov{% if suite_cur == 'gov' %} on{% endif %}" href="/governance"{% if suite_cur == 'gov' %} aria-current="page"{% endif %}><i></i>Governance</a>
    </nav>
    <span class="sp"></span>
    {% if demo_mode %}<span class="chip ex">Demo data</span>{% endif %}
    {% include "_persona_select.html" %}
    {% if not hide_signout %}<a class="tbtn" href="/logout">Sign out</a>{% endif %}
    {% if user_role|default('') == 'Platform Admin' %}<a class="tbtn{% if suite_cur == 'tenant' %} on{% endif %}" href="/tenant">Tenant settings</a>{% endif %}
    <button class="tbtn" id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>
